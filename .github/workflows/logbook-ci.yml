name: Logbook CI bundle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - if: always()
        run: npx playwright-logbook export --out ci-run.logbook.zip --project-id pw-test --artifacts
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logbook-run
          path: ci-run.logbook.zip
          if-no-files-found: error
          retention-days: 30
